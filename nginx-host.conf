# Install this on the DROPLET itself (not in a container) at:
#   /etc/nginx/sites-available/encrypz
# then: ln -s /etc/nginx/sites-available/encrypz /etc/nginx/sites-enabled/
#
# Replace yourdomain.com with your real domain. Point both A records
# (yourdomain.com and api.yourdomain.com) at the droplet's IP first.
#
# Run certbot AFTER this file is enabled and nginx reloaded:
#   sudo certbot --nginx -d yourdomain.com -d api.yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:5207;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
